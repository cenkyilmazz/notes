<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Week Notes</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #141414;
    --box-border: #EFEFEF;
    --box-border-hover: #B1B0B0;
    --divider: #DADAD6;
    --muted: #9C9C97;
    --header-bg: #FFFFFF;
    --header-stroke: #E3E3E3;
    --day-name-color: #C4C4C4;
  }
  html, body {
    height: 100%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    cursor: url("assets/cursor.svg") 9 2, auto;
  }

  /* Header */
  .header {
    position: relative;
    flex: 0 0 96px;
    height: 96px;
    background: var(--header-bg);
    border-bottom: 2px solid var(--header-stroke);
    display: flex;
    align-items: center;
    padding: 0 24px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .month-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.8px;
    margin: 0;
    color: var(--ink);
  }
  .month-title .month-subtitle {
    color: #C4C4C4;
  }
  .now-btn {
    position: relative;
    width: 44px;
    height: 44px;
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .now-avatar-group {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .now-btn svg {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
  }
  .now-btn .hover-svg { opacity: 0; }
  .now-btn:hover .default-svg { opacity: 0; }
  .now-btn:hover .hover-svg { opacity: 1; }
  .nav-buttons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .nav-btn svg { display: block; }
  .nav-btn:hover circle { fill: #363636; }

  /* Grid */
  .grid {
    flex: 1 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .day-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 24px 24px 24px 24px;
    border-right: 2px solid #000000;
  }
  .day-col:last-child { border-right: none; }
  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid #000000;
  }
  .day-date {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: #000000;
  }
  .day-name {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--day-name-color);
  }
  .notes-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Note cell */
  .note-cell {
    position: relative;
    width: 100%;
    height: 42px;
    flex: 0 0 42px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 2px solid var(--box-border);
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }
  .note-cell:hover {
    border-color: #000000;
  }
  .note-text-btn,
  .note-text-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    padding: 0 40px 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-text-btn.has-chip { padding-left: 6px; }
  .note-text-btn { cursor: pointer; display: flex; align-items: center; min-width: 0; }
  .note-plain-text {
    display: block;
    max-width: 100%;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .note-chip {
    display: inline-block;
    max-width: 100%;
    padding: 4px 6px;
    border-radius: 8px;
    color: #141414;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  }
  .note-text-input { cursor: text; outline: none; }
  .note-cell.is-completed .note-text-btn,
  .note-cell.is-completed .note-text-input {
    color: var(--muted);
    text-decoration: line-through;
  }
  .tick-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    background: none;
    line-height: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  .note-cell.has-text:hover .tick-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .note-cell.is-completed .tick-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .note-cell.dragging {
    opacity: 0.4;
  }
  .note-cell.drag-target {
    border-color: #000000;
  }
  .tick-btn svg {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  .tick-btn .tick-hover-svg { opacity: 0; }
  .tick-btn:hover .tick-default-svg { opacity: 0; }
  .tick-btn:hover .tick-hover-svg { opacity: 1; }
  .note-cell.is-completed .tick-btn .tick-default-svg { opacity: 0; }
  .note-cell.is-completed .tick-btn .tick-hover-svg { opacity: 1; }

  .footer {
    text-align: center;
    padding: 16px 24px;
  }
  .footer p {
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 11px;
    font-style: normal;
    letter-spacing: -0.2px;
    color: #646464;
    margin: 0;
  }
  .app-root {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 100vh;
  }
  .app-root.visible {
    display: flex;
  }
  .teaser-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .teaser-overlay.teaser-closing {
    opacity: 0;
  }
  .teaser-overlay.teaser-hidden {
    display: none;
  }
  .teaser-logo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .teaser-logo {
    opacity: 0;
    transform: translateY(14px);
    animation: fadeSlideUp 0.5s ease both;
    margin-top: -10px;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .day-col-enter {
    animation: fadeSlideUp 0.4s ease both;
  }
  .note-cell-enter {
    animation: fadeSlideUp 0.35s ease both;
  }
  .header-enter {
    animation: fadeSlideUp 0.4s ease both;
  }
  .footer-enter {
    animation: fadeSlideUp 0.4s ease both 0.15s;
  }

  /* Note popup */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    padding: 120px 24px 24px 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
    overflow-y: auto;
  }
  .modal-overlay.visible { display: flex; }
  .modal-overlay.open { opacity: 1; }
  .profile-avatar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FD6119;
    border: 2px solid #000000;
    border-radius: 50%;
    box-sizing: border-box;
    transition: background 0.15s ease;
  }
  .profile-avatar-btn:hover {
    background: #000000;
  }
  .profile-avatar-btn span {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.9px;
    color: #000000;
    transition: color 0.15s ease;
  }
  .profile-avatar-btn:hover span {
    color: #FFFFFF;
  }
  .name-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    padding: 120px 24px 24px 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .name-overlay.visible { display: flex; }
  .name-overlay.open { opacity: 1; }
  .name-card {
    width: 340px;
    height: 302px;
    max-width: calc(100% - 48px);
    background: #FFFFFF;
    border-radius: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .name-overlay.open .name-card {
    opacity: 1;
    transform: translateY(0);
  }
  .name-logo {
    width: 130px;
    height: 40px;
    margin-top: 44px;
  }
  .name-input {
    width: 284px;
    height: 42px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 2px solid var(--box-border);
    background: #FFFFFF;
    padding: 0 14px 0 8px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    letter-spacing: -0.3px;
    outline: none;
    margin-top: 28px;
  }
  .name-input + .name-input {
    margin-top: 12px;
  }
  .name-input:hover,
  .name-input:focus {
    border-color: #000000;
  }
  .name-input.input-shake {
    border-color: #DC2727;
    animation: inputShake 0.4s ease;
  }
  @keyframes inputShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .name-save-btn {
    width: 284px;
    height: 38px;
    background: #000000;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 28px;
    margin-bottom: 28px;
    transition: background 0.15s ease;
  }
  .name-save-btn:hover {
    background: #363636;
  }
  .dashboard-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    padding: 120px 24px 24px 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .dashboard-overlay.visible { display: flex; }
  .dashboard-overlay.open { opacity: 1; }
  .dashboard-card {
    width: 685px;
    height: 430px;
    max-width: 100%;
    background: #FFFFFF;
    border-radius: 12px;
    box-sizing: border-box;
    padding: 20px 20px 20px 20px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .dashboard-overlay.open .dashboard-card {
    opacity: 1;
    transform: translateY(0);
  }
  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    margin-bottom: 20px;
  }
  .dashboard-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: #000000;
    margin: 0;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 215px);
    grid-template-rows: repeat(2, 168px);
    gap: 0;
  }
  .stat-cell {
    border: 2px solid #000000;
    border-radius: 8px;
    box-sizing: border-box;
    padding: 16px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeSlideUp 0.35s ease both;
  }
  .stat-cell:nth-child(1) { animation-delay: 0ms; }
  .stat-cell:nth-child(2) { animation-delay: 60ms; }
  .stat-cell:nth-child(3) { animation-delay: 120ms; }
  .stat-cell:nth-child(4) { animation-delay: 180ms; }
  .stat-cell:nth-child(5) { animation-delay: 240ms; }
  .stat-cell:nth-child(6) { animation-delay: 300ms; }
  .stat-cell:nth-child(2),
  .stat-cell:nth-child(3) {
    margin-left: -2px;
  }
  .stat-cell:nth-child(4),
  .stat-cell:nth-child(5),
  .stat-cell:nth-child(6) {
    margin-top: -2px;
  }
  .stat-cell:nth-child(5),
  .stat-cell:nth-child(6) {
    margin-left: -2px;
  }
  .stat-label {
    display: block;
    flex-shrink: 0;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.4px;
    color: #000000;
    padding-bottom: 6px;
    border-bottom: 2px solid #000000;
    width: 100%;
    box-sizing: border-box;
  }
  .stat-box {
    flex: 1 1 auto;
    margin-top: 16px;
    border: 2px solid #D2D2D2;
    border-radius: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-value {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: -1.5px;
    color: #000000;
  }
  .search-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    padding: 120px 24px 24px 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .search-overlay.visible { display: flex; }
  .search-overlay.open { opacity: 1; }
  .search-panel {
    width: 642px;
    max-width: 100%;
    background: transparent;
    box-sizing: border-box;
    opacity: 0;
    transform: translateY(-16px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-height: calc(100vh - 164px);
    display: flex;
    flex-direction: column;
  }
  .search-overlay.open .search-panel {
    opacity: 1;
    transform: translateY(0);
  }
  .search-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 20px;
    gap: 12px;
    background: #FFFFFF;
    border-radius: 12px;
  }
  .search-results {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 20px;
    margin-top: 2px;
    background: #FFFFFF;
    border-radius: 12px;
    box-sizing: border-box;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .search-panel.has-query .search-results { display: flex; }
  .search-results.show {
    opacity: 1;
    transform: translateY(0);
  }
  .search-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 2px solid var(--box-border);
    border-radius: 8px;
    padding: 10px 14px;
    box-sizing: border-box;
    background: #FFFFFF;
    cursor: pointer;
    text-align: left;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .search-result-item:hover {
    border-color: #000000;
  }
  .search-result-text {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 16px;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .search-result-date {
    flex-shrink: 0;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #000000;
  }
  .search-empty {
    font-family: "Inter", sans-serif;
    font-size: 14px;
    color: var(--muted);
    padding: 4px 2px;
  }
  .search-input {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: -0.6px;
    color: #000000;
  }
  .search-input::placeholder { color: #9C9C97; }
  .search-clear-btn {
    flex-shrink: 0;
    position: relative;
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .search-clear-btn.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .search-clear-btn img { position: absolute; top: 0; left: 0; width: 24px; height: 24px; }
  .search-clear-btn .delete-mini-hover { opacity: 0; }
  .search-clear-btn:hover .delete-mini-idle { opacity: 0; }
  .search-clear-btn:hover .delete-mini-hover { opacity: 1; }
  .modal-card {
    width: 552px;
    max-width: 100%;
    height: 360px;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .modal-overlay.open .modal-card {
    opacity: 1;
    transform: translateY(0);
  }
  .modal-overlay.closing .modal-card {
    opacity: 0;
    transform: translateY(-24px);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .modal-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.5px;
    color: #000000;
    margin: 0;
  }
  .modal-header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hamburger-btn,
  .jira-btn {
    position: relative;
    width: 34px;
    height: 34px;
  }
  .hamburger-btn svg,
  .jira-btn svg {
    position: absolute;
    top: 0;
    left: 0;
  }
  .hamburger-btn .hamburger-hover,
  .jira-btn .jira-hover { opacity: 0; transition: opacity 0.15s ease; }
  .hamburger-btn:hover .hamburger-default,
  .jira-btn:hover .jira-default { opacity: 0; }
  .hamburger-btn:hover .hamburger-hover,
  .jira-btn:hover .jira-hover { opacity: 1; }
  .jira-wrapper {
    position: relative;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .jira-board-toggle {
    display: none;
    position: absolute;
    top: 39px;
    left: -33px;
    width: 100px;
    height: 24px;
    z-index: 20;
  }
  .jira-board-toggle.open { display: block; }
  .jira-board-toggle svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 24px;
    pointer-events: none;
  }
  .jira-board-hover-ocu,
  .jira-board-hover-tex {
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .jira-board-hover-ocu.show,
  .jira-board-hover-tex.show {
    opacity: 1;
  }
  .jira-board-half {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .jira-board-half-left { left: 0; }
  .jira-board-half-right { right: 0; }
  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .icon-btn svg { display: block; }
  .close-btn {
    position: relative;
    width: 34px;
    height: 34px;
  }
  .close-btn svg {
    position: absolute;
    top: 0;
    left: 0;
  }
  .close-btn .close-hover { opacity: 0; transition: opacity 0.15s ease; }
  .close-btn:hover .close-default { opacity: 0; }
  .close-btn:hover .close-hover { opacity: 1; }
  .modal-textarea {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    border: none;
    padding: 8px 12px 8px 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    letter-spacing: -0.2px;
    line-height: 25px;
    color: #000000;
    resize: none;
    outline: none;
    box-sizing: border-box;
    display: block;
    overflow-y: auto;
  }
  .modal-textarea-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 2px solid var(--box-border);
    border-radius: 8px;

<script>
  const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const FULL_DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ROW_HEIGHT = 42;
  const ROW_GAP = 8;

  const TICK_SVG = `<svg class="tick-default-svg" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M6 9L8.17582 11L12 7" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="9" cy="9" r="8" stroke="black" stroke-width="2"/>
</svg>`;
  const TICK_HOVER_SVG = `<svg class="tick-hover-svg" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="9" cy="9" r="8" fill="black" stroke="black" stroke-width="2"/>
<path d="M6 9L8.17582 11L12 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
  const TICK_COMBINED_SVG = TICK_SVG + TICK_HOVER_SVG;

  let weekOffset = 0;
  // notesData[dk] = [{ text: "", completed: false }, ...]
  const notesData = {};
  const STORAGE_KEY = "hafta-notlari-data-v1";

  // ---- Speech-to-text (voice notes) ----
  let activeRecognition = null;
  let activeRecognitionBtn = null;

  function isSpeechSupported() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function stopSpeechIfActive(btn) {
    if (activeRecognition && (!btn || activeRecognitionBtn === btn)) {
      const rec = activeRecognition;
      activeRecognition = null;
      const prevBtn = activeRecognitionBtn;
      activeRecognitionBtn = null;
      rec.onend = null;
      try { rec.stop(); } catch (e) {}
      if (prevBtn) prevBtn.classList.remove("listening");
    }
  }

  function toggleSpeechForField(btn, field) {
    if (!isSpeechSupported()) return;
    if (activeRecognition && activeRecognitionBtn === btn) {
      stopSpeechIfActive(btn);
      return;
    }
    stopSpeechIfActive(activeRecognitionBtn);

    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = "tr-TR";
    recognition.continuous = true;
    recognition.interimResults = true;

    let baseText = field.value ? field.value.trim() : "";

    recognition.onresult = (event) => {
      let finalChunk = "";
      let interimChunk = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalChunk += transcript;
        } else {
          interimChunk += transcript;
        }
      }
      if (finalChunk) {
        baseText = (baseText ? baseText + " " : "") + finalChunk.trim();
      }
      field.value = (baseText ? baseText + " " : "") + interimChunk;
    };

    recognition.onerror = () => {
      stopSpeechIfActive(btn);
    };

    recognition.onend = () => {
      if (activeRecognitionBtn === btn && activeRecognition === recognition) {
        try {
          recognition.start();
        } catch (e) {
          stopSpeechIfActive(btn);
        }
      }
    };

    try {
      recognition.start();
    } catch (e) {
      return;
    }
    activeRecognition = recognition;
    activeRecognitionBtn = btn;
    btn.classList.add("listening");
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
    } catch (e) {
      console.error("Storage save failed", e);
    }
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        Object.keys(parsed).forEach((dk) => { notesData[dk] = parsed[dk]; });
      }
    } catch (e) {
      console.error("Storage load failed", e);
    }
  }

  // ---- User name (personalization) ----
  const USER_FIRSTNAME_KEY = "hafta-notlari-firstname";
  const USER_LASTNAME_KEY = "hafta-notlari-lastname";

  function getUserFirstName() {
    try {
      return (localStorage.getItem(USER_FIRSTNAME_KEY) || "").trim();
    } catch (e) {
      return "";
    }
  }

  function getUserLastName() {
    try {
      return (localStorage.getItem(USER_LASTNAME_KEY) || "").trim();
    } catch (e) {
      return "";
    }
  }

  function setUserName(firstName, lastName) {
    try {
      localStorage.setItem(USER_FIRSTNAME_KEY, firstName.trim());
      localStorage.setItem(USER_LASTNAME_KEY, lastName.trim());
    } catch (e) {}
  }

  function updateProfileAvatar() {
    const firstName = getUserFirstName();
    const lastName = getUserLastName();
    const initialEl = document.getElementById("profileAvatarInitial");
    if (!firstName) {
      initialEl.textContent = "?";
    } else {
      const firstInitial = firstName.charAt(0).toUpperCase();
      const lastInitial = lastName ? lastName.charAt(0).toUpperCase() : "";
      initialEl.textContent = firstInitial + lastInitial;
    }
  }

  function subtitleText() {
    const firstName = getUserFirstName();
    return firstName ? `${firstName}'s To-Do List` : "To-Do List";
  }
  let dragSource = null; // { dk, index }

  function pad(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    // Weekdays-only calendar: on a weekend, jump forward to the upcoming Monday
    // instead of showing the work week that has already passed.
    let diff;
    if (day === 0) diff = 1;       // Sunday -> next day (Monday)
    else if (day === 6) diff = 2;  // Saturday -> Monday after next
    else diff = 1 - day;           // Mon-Fri -> Monday of this week
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function getWorkweek(offset) {
    const monday = getMonday(new Date());
    monday.setDate(monday.getDate() + offset * 7);
    return Array.from({length: 5}, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d;
    });
  }

  function monthLabel(dates) {
    const a = dates[0];
    return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  }

  // The grid only shows Mon-Fri. On a weekend, "today" isn't a column on the
  // board — the board's active day is the upcoming Monday instead. This keeps
  // the onboarding/celebration popups in sync with the day actually shown.
  function effectiveTodayKey() {
    const now = new Date();
    const day = now.getDay();
    if (day === 0 || day === 6) {
      return keyOf(getMonday(now));
    }
    return keyOf(now);
  }

  function ensureDay(dk) {
    if (!notesData[dk]) {
      notesData[dk] = Array.from({ length: 12 }, () => ({ text: "", completed: false }));
    }
    return notesData[dk];
  }

  function updateCellState(wrapper, dk, index) {
    const item = notesData[dk][index];
    const hasText = item.text.trim().length > 0;
    wrapper.classList.toggle("has-text", hasText);
    wrapper.classList.toggle("is-completed", !!item.completed);
    const textBtn = wrapper.querySelector(".note-text-btn");
    if (textBtn) renderButtonContent(textBtn, dk, index);
  }

  function enterEdit(wrapper, dk, index) {
    maybeGrowAll(dk, index);
    const item = notesData[dk][index];
    if (item.text.trim().length === 0) {
      startInlineEdit(wrapper, dk, index);
    } else {
      openModal(dk, index);
    }
  }

  function startInlineEdit(wrapper, dk, index) {
    const current = wrapper.querySelector(".note-text-btn, .note-text-input");
    if (!current || current.tagName === "INPUT") return;

    let moveToNext = false;
    let micBtn = null;
    const input = document.createElement("input");
    input.className = "note-text-input";
    input.value = notesData[dk][index].text;

  function buildCell(dk, index, delayMs, animate) {

      updateCellState(wrapper, dk, index);
      saveToStorage();
    });
    wrapper.appendChild(tick);

    // Drag and drop
    wrapper.addEventListener("dragstart", (e) => {
      const child = wrapper.querySelector(".note-text-btn, .note-text-input");
      if (child && child.tagName === "INPUT") { e.preventDefault(); return; }
      dragSource = { dk, index };
      wrapper.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", `${dk}::${index}`);

      // Custom shadow-free drag preview matching our own note-cell design
      const rect = wrapper.getBoundingClientRect();
      const preview = wrapper.cloneNode(true);
      preview.classList.remove("dragging");
      preview.style.position = "fixed";
      preview.style.top = "-1000px";
      preview.style.left = "-1000px";
      preview.style.margin = "0";
      preview.style.width = rect.width + "px";
      preview.style.height = rect.height + "px";
      preview.style.boxShadow = "none";
      preview.style.pointerEvents = "none";
      document.body.appendChild(preview);
      e.dataTransfer.setDragImage(preview, e.offsetX, e.offsetY);
      setTimeout(() => preview.remove(), 0);
    });
    wrapper.addEventListener("dragend", () => {
      wrapper.classList.remove("dragging");
      dragSource = null;
    });
    wrapper.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });
    wrapper.addEventListener("dragenter", (e) => {
      e.preventDefault();
      wrapper.classList.add("drag-target");
    });
    wrapper.addEventListener("dragleave", () => {
      wrapper.classList.remove("drag-target");
    });
    wrapper.addEventListener("drop", (e) => {
      e.preventDefault();
      wrapper.classList.remove("drag-target");
      if (!dragSource) return;
      const src = dragSource;
      dragSource = null;
      if (src.dk === dk && src.index === index) return;
      moveNote(src.dk, src.index, dk, index);
      render({ animate: false });
      saveToStorage();
    });

    updateCellState(wrapper, dk, index);
    return wrapper;
  }

  function moveNote(srcDk, srcIndex, dstDk, dstIndex) {
    const srcArr = ensureDay(srcDk);
    const dstArr = ensureDay(dstDk);
    const [item] = srcArr.splice(srcIndex, 1);
    let insertAt = dstIndex;
    if (srcArr === dstArr && srcIndex < dstIndex) insertAt -= 1;
    dstArr.splice(insertAt, 0, item);
    // keep the source day from running out of empty rows
    if (srcArr.length === 0) srcArr.push({ text: "", completed: false });
  }

  function isWeekendDate(date) {

  function computeStats() {
    let total = 0;
    let completed = 0;
    const dayOfWeekCounts = [0, 0, 0, 0, 0]; // Mon..Fri, aligned with DAY_NAMES

    Object.keys(notesData).forEach((dk) => {
      const items = notesData[dk];
      const [y, m, d] = dk.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const dow = date.getDay(); // 0=Sun..6=Sat
      const dayIdx = dow - 1; // 0=Mon..4=Fri, negative for Sat/Sun
      items.forEach((item) => {
        if (hasNoteText(item)) {
          total++;
          if (item.completed) completed++;
          if (dayIdx >= 0 && dayIdx <= 4) dayOfWeekCounts[dayIdx]++;
        }
      });
    });

    const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

    // This week (real current week, offset 0)
    const thisWeekDates = getWorkweek(0);
    let thisWeekCount = 0;
    thisWeekDates.forEach((date) => {
      const dk = keyOf(date);
      const items = notesData[dk] || [];
      thisWeekCount += items.filter(hasNoteText).length;
    });

    // Current streak (consecutive workdays with at least one note, walking back from today)
    let cursor = new Date();
    const todayKey = keyOf(cursor);
    const todayHasNotes = notesData[todayKey] && notesData[todayKey].some(hasNoteText);
    if (!todayHasNotes) {
      cursor.setDate(cursor.getDate() - 1);
    }
    let streak = 0;
    let guard = 0;
    while (guard < 3650) {
      guard++;
      if (isWeekendDate(cursor)) {
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      const k = keyOf(cursor);
      const items = notesData[k];
      if (items && items.some(hasNoteText)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }

    // Most active day of week
    let mostActiveIdx = -1;
    let mostActiveCount = -1;
    dayOfWeekCounts.forEach((count, idx) => {
      if (count > mostActiveCount) {
        mostActiveCount = count;
        mostActiveIdx = idx;
      }
    });
    const mostActiveDay = mostActiveCount > 0 ? DAY_NAMES[mostActiveIdx] : "-";

    return {
      total,
      completed,
      completionRate,
      thisWeekCount,
      streak,
      mostActiveDay,
    };
  }

      shakeAndFocus(surnameInput);
      return;
    }
    setUserName(first, last);
    updateProfileAvatar();
    render({ animate: false });
    closeNamePopup();
  }

  [nameInput, surnameInput].forEach((el) => {
    el.addEventListener("animationend", () => {
      el.classList.remove("input-shake");
    });
  });

  nameSaveBtn.addEventListener("click", saveNameFromPopup);
  [nameInput, surnameInput].forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveNameFromPopup();
    });
  });
  profileAvatarBtn.addEventListener("click", openNamePopup);

  nameOverlay.addEventListener("click", (e) => {
    if (e.target === nameOverlay) closeNamePopup();
  });

  // ---- Teaser splash ----
  const teaserOverlay = document.getElementById("teaserOverlay");
  const appRoot = document.getElementById("appRoot");

  setTimeout(() => {
    teaserOverlay.classList.add("teaser-closing");
    setTimeout(() => {
      teaserOverlay.classList.add("teaser-hidden");
      appRoot.classList.add("visible");
      if (!getUserFirstName()) {
        openNamePopup();
      }
    }, 400);
  }, 1500);

  // ---- Daily notification reminders (09:00 / 12:00 / 15:00 / 18:00) ----
  const DAILY_CHECK_TIMES = [[9, 0], [12, 0], [15, 0], [18, 0]];
  const DAILY_CHECK_STORAGE_KEY = "daily-check-last-slot-v1";

  function getIncompleteNotesForToday() {
    const dk = effectiveTodayKey();
    const items = notesData[dk] || [];
    return items
      .filter((item) => item.text && item.text.trim() && !item.completed)
      .map((item) => item.text.trim());
  }

  function performDailyCheck() {
    const notes = getIncompleteNotesForToday();
    if (notes.length > 0 && typeof Notification !== "undefined" && Notification.permission === "granted") {
      try {
        new Notification("Hatırlatma", {
          body: notes.map((t) => `• ${t}`).join("\n"),
        });
      } catch (e) {}
    }
  }

  function slotKeyFor(date, h, m) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}-${pad(h)}:${pad(m)}`;
  }

  function getLastPastSlotToday(now) {
    let last = null;
    for (const [h, m] of DAILY_CHECK_TIMES) {
      const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
      if (candidate <= now) {
        last = [h, m];
      }
    }
    return last;
  }

  // Runs on load and whenever the tab becomes visible again. If the browser
  // discarded/suspended this tab (memory saver, sleep, etc.) and a check
  // time was silently missed, this catches up as soon as the page is alive
  // again, instead of only waiting for the next scheduled slot.
  function catchUpMissedDailyCheck() {
    const now = new Date();
    const lastSlot = getLastPastSlotToday(now);
    if (!lastSlot) return;
    const key = slotKeyFor(now, lastSlot[0], lastSlot[1]);
    let stored = null;
    try {
      stored = localStorage.getItem(DAILY_CHECK_STORAGE_KEY);
    } catch (e) {}
    if (stored !== key) {
      performDailyCheck();
      try {
        localStorage.setItem(DAILY_CHECK_STORAGE_KEY, key);
      } catch (e) {}
    }
  }

  function scheduleNextDailyCheck() {
    const now = new Date();
    let target = null;
    for (const [h, m] of DAILY_CHECK_TIMES) {
      const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
      if (candidate > now) {
        target = candidate;
        break;
      }
    }
    if (!target) {
      target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, DAILY_CHECK_TIMES[0][0], DAILY_CHECK_TIMES[0][1], 0, 0);
    }
    const delay = target - now;
    setTimeout(() => {
      catchUpMissedDailyCheck();
      scheduleNextDailyCheck();
    }, delay);
  }

  if (typeof Notification !== "undefined") {
    catchUpMissedDailyCheck();
    scheduleNextDailyCheck();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        catchUpMissedDailyCheck();
      }
    });
    if (Notification.permission === "default") {
      const requestOnFirstClick = () => {
        document.removeEventListener("click", requestOnFirstClick);
        Notification.requestPermission();
      };
      document.addEventListener("click", requestOnFirstClick);
    }
  }
</script>
