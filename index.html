<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Week Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #141414;
    --box-border: #EFEFEF;
    --box-border-hover: #B1B0B0;
    --divider: #DADAD6;
    --muted: #9C9C97;
    --header-bg: #FFFFFF;
    --header-stroke: #E3E3E3;
    --day-name-color: #C4C4C4;
  }
  html, body {
    height: 100%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  .header {
    flex: 0 0 100px;
    height: 100px;
    background: var(--header-bg);
    border-bottom: 2px solid var(--header-stroke);
    display: flex;
    align-items: center;
    padding: 0 24px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .month-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.5px;
    margin: 0;
    color: var(--ink);
  }
  .today-btn {
    position: relative;
    width: 70px;
    height: 24px;
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .today-btn svg {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
  }
  .today-btn .hover-svg { opacity: 0; }
  .today-btn:hover .default-svg { opacity: 0; }
  .today-btn:hover .hover-svg { opacity: 1; }
  .nav-buttons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .nav-btn svg { display: block; }

  /* Grid */
  .grid {
    flex: 1 0 auto;
    display: flex;
    flex-direction: row;
  }
  @media (max-width: 900px) {
    .grid { flex-direction: column; }
  }
  .day-col {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    padding: 24px 24px 24px 24px;
    border-right: 2px solid #000000;
  }
  .day-col:last-child { border-right: none; }
  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid #000000;
  }
  .day-date {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: #000000;
  }
  .day-name {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--day-name-color);
  }
  .notes-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Note cell */
  .note-cell {
    position: relative;
    width: 100%;
    height: 42px;
    flex: 0 0 42px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 2px solid var(--box-border);
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }
  .note-cell:hover {
    border-color: var(--box-border-hover);
  }
  .note-text-btn,
  .note-text-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    padding: 0 40px 0 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-text-btn { cursor: pointer; }
  .note-text-input { cursor: text; outline: none; }
  .note-cell.is-completed .note-text-btn,
  .note-cell.is-completed .note-text-input {
    color: var(--muted);
    text-decoration: line-through;
  }
  .tick-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    background: none;
    line-height: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  .note-cell.has-text:hover .tick-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .note-cell.dragging {
    opacity: 0.4;
  }
  .note-cell.drag-target {
    border-color: #000000;
  }
  .tick-btn svg { display: block; }

  .footer {
    text-align: center;
    padding: 16px 24px;
  }
  .footer p {
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 11px;
    font-style: normal;
    color: #646464;
    margin: 0;
  }
</style>
</head>

</svg>`;

  let weekOffset = 0;
  // notesData[dk] = [{ text: "", completed: false }, ...]
  const notesData = {};
  let dragSource = null; // { dk, index }

  function pad(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function getWorkweek(offset) {
    const monday = getMonday(new Date());
    monday.setDate(monday.getDate() + offset * 7);
    return Array.from({length: 5}, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d;
    });
  }

  function monthLabel(dates) {
    const a = dates[0];
    return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  }

  function ensureDay(dk) {
    if (!notesData[dk]) {
      notesData[dk] = Array.from({ length: 13 }, () => ({ text: "", completed: false }));
    }
    return notesData[dk];
  }

  function updateCellState(wrapper, dk, index) {
    const item = notesData[dk][index];
    const hasText = item.text.trim().length > 0;
    wrapper.classList.toggle("has-text", hasText);
    wrapper.classList.toggle("is-completed", !!item.completed);
    const tick = wrapper.querySelector(".tick-btn");
    if (tick) tick.innerHTML = item.completed ? TICK_HOVER_SVG : TICK_SVG;
  }

  function enterEdit(wrapper, dk, index) {
    const current = wrapper.querySelector(".note-text-btn, .note-text-input");
    if (!current || current.tagName === "INPUT") return;

    const input = document.createElement("input");
    input.className = "note-text-input";
    input.value = notesData[dk][index].text;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === "Escape") input.blur();
    });
    input.addEventListener("blur", () => {
      notesData[dk][index].text = input.value;
      const btn = buildTextButton(wrapper, dk, index);
      input.replaceWith(btn);
      updateCellState(wrapper, dk, index);
    });
    current.replaceWith(input);
    input.focus();
    input.select();

    maybeGrowAll(dk, index);
  }

  function buildTextButton(wrapper, dk, index) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "note-text-btn";
    btn.textContent = notesData[dk][index].text;
    btn.addEventListener("click", () => enterEdit(wrapper, dk, index));
    return btn;
  }

  function buildCell(dk, index) {
    const wrapper = document.createElement("div");
    wrapper.className = "note-cell";
    wrapper.draggable = true;

    wrapper.appendChild(buildTextButton(wrapper, dk, index));

    const tick = document.createElement("button");
    tick.type = "button";
    tick.className = "tick-btn";
    tick.setAttribute("aria-label", "Tamamlandı olarak işaretle");
    tick.innerHTML = notesData[dk][index].completed ? TICK_HOVER_SVG : TICK_SVG;
    tick.addEventListener("click", (e) => {
      e.stopPropagation();
      notesData[dk][index].completed = !notesData[dk][index].completed;
      updateCellState(wrapper, dk, index);
    });
    wrapper.appendChild(tick);

    // Drag and drop
    wrapper.addEventListener("dragstart", (e) => {
      const child = wrapper.querySelector(".note-text-btn, .note-text-input");
      if (child && child.tagName === "INPUT") { e.preventDefault(); return; }
      dragSource = { dk, index };
      wrapper.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", `${dk}::${index}`);

      // Custom shadow-free drag preview matching our own note-cell design
      const rect = wrapper.getBoundingClientRect();
      const preview = wrapper.cloneNode(true);
      preview.classList.remove("dragging");
      preview.style.position = "fixed";
      preview.style.top = "-1000px";
      preview.style.left = "-1000px";
      preview.style.margin = "0";
      preview.style.width = rect.width + "px";
      preview.style.height = rect.height + "px";
      preview.style.boxShadow = "none";
      preview.style.pointerEvents = "none";
      document.body.appendChild(preview);
      e.dataTransfer.setDragImage(preview, e.offsetX, e.offsetY);
      setTimeout(() => preview.remove(), 0);
    });
    wrapper.addEventListener("dragend", () => {
      wrapper.classList.remove("dragging");
      dragSource = null;
    });
    wrapper.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });
    wrapper.addEventListener("dragenter", (e) => {
      e.preventDefault();
      wrapper.classList.add("drag-target");
    });
    wrapper.addEventListener("dragleave", () => {
      wrapper.classList.remove("drag-target");
    });
    wrapper.addEventListener("drop", (e) => {
      e.preventDefault();
      wrapper.classList.remove("drag-target");
      if (!dragSource) return;
      const src = dragSource;
      dragSource = null;
      if (src.dk === dk && src.index === index) return;
      moveNote(src.dk, src.index, dk, index);
      render();
    });

    updateCellState(wrapper, dk, index);
    return wrapper;
  }

  function moveNote(srcDk, srcIndex, dstDk, dstIndex) {
    const srcArr = ensureDay(srcDk);
    const dstArr = ensureDay(dstDk);
    const [item] = srcArr.splice(srcIndex, 1);
    let insertAt = dstIndex;
    if (srcArr === dstArr && srcIndex < dstIndex) insertAt -= 1;
    dstArr.splice(insertAt, 0, item);
    // keep the source day from running out of empty rows
    if (srcArr.length === 0) srcArr.push({ text: "", completed: false });
  }

  function maybeGrowAll(dk, index) {
    if (index === notesData[dk].length - 1) {
      growAllDays();
      window.requestAnimationFrame(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      });
    }
  }

  function growAllDays() {
    const grid = document.getElementById("weekGrid");
    const cols = grid.querySelectorAll(".day-col");
    cols.forEach((col) => {
      const dk = col.dataset.dk;
      const arr = ensureDay(dk);
      const nextIndex = arr.length;
      arr.push({ text: "", completed: false });
      const notesCol = col.querySelector(".notes-col");
      notesCol.appendChild(buildCell(dk, nextIndex));
    });
  }

  function balanceWeek(dks) {
    let maxLen = 0;
    dks.forEach((dk) => { maxLen = Math.max(maxLen, notesData[dk].length); });
    dks.forEach((dk) => {
      while (notesData[dk].length < maxLen) {
        notesData[dk].push({ text: "", completed: false });
      }
    });
  }

  function render() {
    const dates = getWorkweek(weekOffset);
    document.getElementById("monthTitle").textContent = monthLabel(dates);

    const dks = dates.map(keyOf);
    dks.forEach(ensureDay);
    balanceWeek(dks);

    const grid = document.getElementById("weekGrid");
    grid.innerHTML = "";

    dates.forEach((date, i) => {
      const dk = dks[i];

      const col = document.createElement("div");
      col.className = "day-col";
      col.dataset.dk = dk;

      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `
        <span class="day-date">${date.getDate()} ${MONTHS_SHORT[date.getMonth()]}</span>
        <span class="day-name">${DAY_NAMES[i]}</span>
      `;
      col.appendChild(head);

      const notesCol = document.createElement("div");
      notesCol.className = "notes-col";
      notesData[dk].forEach((_, index) => {
        notesCol.appendChild(buildCell(dk, index));
      });
      col.appendChild(notesCol);

      grid.appendChild(col);
    });
  }

  document.getElementById("prevBtn").addEventListener("click", () => { weekOffset -= 1; render(); });
  document.getElementById("nextBtn").addEventListener("click", () => { weekOffset += 1; render(); });
  document.getElementById("todayBtn").addEventListener("click", () => { weekOffset = 0; render(); });

  render();
</script>

</body>
</html>
