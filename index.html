<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Week Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #141414;
    --box-border: #EFEFEF;
    --box-border-hover: #B1B0B0;
    --divider: #DADAD6;
    --muted: #9C9C97;
    --header-bg: #FFFFFF;
    --header-stroke: #E3E3E3;
    --day-name-color: #C4C4C4;
  }
  html, body {
    height: 100%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  .header {
    flex: 0 0 96px;
    height: 96px;
    background: var(--header-bg);
    border-bottom: 2px solid var(--header-stroke);
    display: flex;
    align-items: center;
    padding: 0 24px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .month-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.5px;
    margin: 0;
    color: var(--ink);
  }
  .today-btn {
    position: relative;
    width: 70px;
    height: 24px;
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .today-btn svg {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
  }
  .today-btn .hover-svg { opacity: 0; }
  .today-btn:hover .default-svg { opacity: 0; }
  .today-btn:hover .hover-svg { opacity: 1; }
  .nav-buttons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .nav-btn svg { display: block; }
  .nav-btn:hover circle { fill: #363636; }

  /* Grid */
  .grid {
    flex: 1 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .day-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 24px 24px 24px 24px;
    border-right: 2px solid #000000;
  }
  .day-col:last-child { border-right: none; }
  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid #000000;
  }
  .day-date {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: #000000;
  }
  .day-name {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--day-name-color);
  }
  .notes-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Note cell */
  .note-cell {
    position: relative;
    width: 100%;
    height: 42px;
    flex: 0 0 42px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 2px solid var(--box-border);
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }
  .note-cell:hover {
    border-color: #000000;
  }
  .note-text-btn,
  .note-text-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    padding: 0 40px 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-text-btn.has-chip { padding-left: 6px; }
  .note-text-btn { cursor: pointer; display: flex; align-items: center; }
  .note-chip {
    display: inline-block;
    max-width: 100%;
    padding: 4px 6px;
    border-radius: 8px;
    color: #141414;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  }
  .note-text-input { cursor: text; outline: none; }
  .note-cell.is-completed .note-text-btn,
  .note-cell.is-completed .note-text-input {
    color: var(--muted);
    text-decoration: line-through;
  }
  .tick-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    background: none;
    line-height: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  .note-cell.has-text:hover .tick-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .note-cell.dragging {
    opacity: 0.4;
  }
  .note-cell.drag-target {
    border-color: #000000;
  }
  .tick-btn svg { display: block; }

  .footer {
    text-align: center;
    padding: 16px 24px;
  }
  .footer p {
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 11px;
    font-style: normal;
    color: #646464;
    margin: 0;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .day-col-enter {
    animation: fadeSlideUp 0.4s ease both;
  }
  .note-cell-enter {
    animation: fadeSlideUp 0.35s ease both;
  }
  .header-enter {
    animation: fadeSlideUp 0.4s ease both;
  }

  /* Onboarding popup */
  .onboarding-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: center;
    justify-content: center;
    z-index: 1100;
    padding: 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .onboarding-overlay.visible { display: flex; }
  .onboarding-overlay.open { opacity: 1; }
  .onboarding-card {
    position: relative;
    width: 381px;
    max-width: 100%;
    min-height: 223px;
    background: #FFFFFF;
    border-radius: 12px;
    box-sizing: border-box;
    padding: 20px 20px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    overflow: visible;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .onboarding-overlay.open .onboarding-card {
    opacity: 1;
    transform: translateY(0);
  }
  .onboarding-overlay.closing .onboarding-card {
    opacity: 0;
    transform: translateY(-24px);
  }
  .onboarding-icon {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 91px;
    display: block;
    pointer-events: none;
    z-index: 2;
  }
  .onboarding-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.4px;
    color: #000000;
    margin: 34px 0 6px 0;
  }
  .onboarding-desc {
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: -0.3px;
    line-height: 25px;
    color: #000000;
    margin: 0 0 17px 0;
  }
  .onboarding-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
    width: 100%;
  }
  .onboarding-btn svg { display: block; width: 100%; height: auto; }

  /* Note popup */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.visible { display: flex; }
  .modal-overlay.open { opacity: 1; }
  .modal-card {
    width: 552px;
    max-width: 100%;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 20px;
    box-sizing: border-box;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .modal-overlay.open .modal-card {
    opacity: 1;
    transform: translateY(0);
  }
  .modal-overlay.closing .modal-card {
    opacity: 0;
    transform: translateY(-24px);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: #000000;
    margin: 0;
  }
  .modal-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .icon-btn svg { display: block; }
  .close-btn {
    position: relative;
    width: 34px;
    height: 34px;
  }
  .close-btn svg {
    position: absolute;
    top: 0;
    left: 0;
  }
  .close-btn .close-hover { opacity: 0; transition: opacity 0.15s ease; }
  .close-btn:hover .close-default { opacity: 0; }
  .close-btn:hover .close-hover { opacity: 1; }
  .modal-textarea {
    width: 100%;
    min-height: 150px;
    border: 2px solid var(--box-border);
    border-radius: 8px;
    padding: 8px 16px 14px 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    letter-spacing: -0.2px;
    line-height: 25px;
    color: #000000;
    resize: none;
    outline: none;
    box-sizing: border-box;
    display: block;
  }
  .modal-textarea:focus { border-color: var(--box-border-hover); }
  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }
  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #FFFFFF;
    border: 2px solid #EFEFEF;
    border-radius: 7px;
    height: 38px;
    padding: 0 14px;
    box-sizing: border-box;
  }
  .tag-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .tag-dot.selected {
    box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #000000;
  }
  .modal-footer-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-footer-actions button {
    background: none;
    border: none;
    padding: 0;
    line-height: 0;
    cursor: pointer;
  }
  .modal-footer-actions button svg { display: block; }
  .text-btn {
    height: 38px;
    padding: 0 20px;
    border-radius: 7px;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 14px;
    line-height: 38px !important;
    cursor: pointer;
    box-sizing: border-box;
  }
  .delete-btn {
    background: #FFFFFF;
    border: 2px solid #F5D1D1;
    color: #DC2727;
  }
</style>
</head>

          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const FULL_DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ROW_HEIGHT = 42;
  const ROW_GAP = 8;

  const TICK_SVG = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M6 9L8.17582 11L12 7" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="9" cy="9" r="8" stroke="black" stroke-width="2"/>
</svg>`;
  const TICK_HOVER_SVG = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="9" cy="9" r="8" fill="black" stroke="black" stroke-width="2"/>
<path d="M6 9L8.17582 11L12 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

  let weekOffset = 0;
  // notesData[dk] = [{ text: "", completed: false }, ...]
  const notesData = {};
  const STORAGE_KEY = "hafta-notlari-data-v1";

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
    } catch (e) {
      console.error("Storage save failed", e);
    }
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        Object.keys(parsed).forEach((dk) => { notesData[dk] = parsed[dk]; });
      }
    } catch (e) {
      console.error("Storage load failed", e);
    }
  }
  let dragSource = null; // { dk, index }

  function pad(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    // Weekdays-only calendar: on a weekend, jump forward to the upcoming Monday
    // instead of showing the work week that has already passed.
    let diff;
    if (day === 0) diff = 1;       // Sunday -> next day (Monday)
    else if (day === 6) diff = 2;  // Saturday -> Monday after next
    else diff = 1 - day;           // Mon-Fri -> Monday of this week
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function getWorkweek(offset) {
    const monday = getMonday(new Date());
    monday.setDate(monday.getDate() + offset * 7);
    return Array.from({length: 5}, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d;
    });
  }

  function monthLabel(dates) {
    const a = dates[0];
    return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  }

  function ensureDay(dk) {
    if (!notesData[dk]) {
      notesData[dk] = Array.from({ length: 12 }, () => ({ text: "", completed: false }));
    }
    return notesData[dk];
  }

  function updateCellState(wrapper, dk, index) {
    const item = notesData[dk][index];
    const hasText = item.text.trim().length > 0;
    wrapper.classList.toggle("has-text", hasText);
    wrapper.classList.toggle("is-completed", !!item.completed);
    const tick = wrapper.querySelector(".tick-btn");
    if (tick) tick.innerHTML = item.completed ? TICK_HOVER_SVG : TICK_SVG;
    const textBtn = wrapper.querySelector(".note-text-btn");
    if (textBtn) renderButtonContent(textBtn, dk, index);
  }

  function enterEdit(wrapper, dk, index) {
    maybeGrowAll(dk, index);
    const item = notesData[dk][index];
    if (item.text.trim().length === 0) {
      startInlineEdit(wrapper, dk, index);
    } else {
      openModal(dk, index);
    }
  }

  function startInlineEdit(wrapper, dk, index) {
    const current = wrapper.querySelector(".note-text-btn, .note-text-input");
    if (!current || current.tagName === "INPUT") return;

    const input = document.createElement("input");
    input.className = "note-text-input";
    input.value = notesData[dk][index].text;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === "Escape") input.blur();
    });
    input.addEventListener("blur", () => {
      notesData[dk][index].text = input.value;
      const btn = buildTextButton(wrapper, dk, index);
      input.replaceWith(btn);
      updateCellState(wrapper, dk, index);
      saveToStorage();
    });
    current.replaceWith(input);
    input.focus();
    input.select();
  }

  function hexToRgba(hex, alpha) {
    const clean = hex.replace("#", "");
    const r = parseInt(clean.substring(0, 2), 16);
    const g = parseInt(clean.substring(2, 4), 16);
    const b = parseInt(clean.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function renderButtonContent(btn, dk, index) {
    const item = notesData[dk][index];
    btn.innerHTML = "";
    if (item.color && item.text) {
      btn.classList.add("has-chip");
      const chip = document.createElement("span");
      chip.className = "note-chip";
      chip.style.background = item.completed ? hexToRgba(item.color, 0.5) : item.color;
      chip.style.textDecoration = item.completed ? "line-through" : "none";
      chip.textContent = item.text;
      btn.appendChild(chip);
    } else {
      btn.classList.remove("has-chip");
      btn.textContent = item.text;
    }
  }

  function buildTextButton(wrapper, dk, index) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "note-text-btn";
    renderButtonContent(btn, dk, index);
    btn.addEventListener("click", () => enterEdit(wrapper, dk, index));
    return btn;
  }

  // ---- Note popup ----
  let modalTarget = null; // { dk, index }
  let modalSelectedColor = null;

  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalTextarea = document.getElementById("modalTextarea");
  const tagPill = document.getElementById("tagPill");

  function refreshCellByTarget(dk, index) {
    const col = document.querySelector(`.day-col[data-dk="${dk}"]`);
    if (!col) return;
    const notesCol = col.querySelector(".notes-col");
    const cell = notesCol.children[index];
    if (!cell) return;
    const textEl = cell.querySelector(".note-text-btn");
    if (textEl) renderButtonContent(textEl, dk, index);
    updateCellState(cell, dk, index);
  }

  function openModal(dk, index) {
    modalTarget = { dk, index };
    const item = notesData[dk][index];
    const [y, m, d] = dk.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const dayIdx = getWorkweek(weekOffset).findIndex((dt) => keyOf(dt) === dk);
    const dayName = dayIdx >= 0 ? FULL_DAY_NAMES[dayIdx] : "";
    modalTitle.textContent = `${dayName}, ${date.getDate()} ${MONTHS_SHORT[date.getMonth()]} ${date.getFullYear()}`;
    modalTextarea.value = item.text;
    modalSelectedColor = item.color || null;
    updateTagSelection();
    modalOverlay.classList.remove("closing");
    modalOverlay.classList.add("visible");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        modalOverlay.classList.add("open");
      });
    });
    setTimeout(() => modalTextarea.focus(), 50);
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
    modalOverlay.classList.add("closing");
    modalTarget = null;
    setTimeout(() => {
      modalOverlay.classList.remove("visible");
      modalOverlay.classList.remove("closing");
    }, 200);
  }

  function updateTagSelection() {
    tagPill.querySelectorAll(".tag-dot").forEach((dot) => {
      dot.classList.toggle("selected", dot.dataset.color === modalSelectedColor);
    });
  }

  tagPill.querySelectorAll(".tag-dot").forEach((dot) => {
    dot.addEventListener("click", () => {
      modalSelectedColor = modalSelectedColor === dot.dataset.color ? null : dot.dataset.color;
      updateTagSelection();
    });
  });

  document.getElementById("modalSaveBtn").addEventListener("click", () => {
    if (!modalTarget) return;
    const { dk, index } = modalTarget;
    notesData[dk][index].text = modalTextarea.value;
    notesData[dk][index].color = modalSelectedColor;
    refreshCellByTarget(dk, index);
    closeModal();
    saveToStorage();
  });

  document.getElementById("modalDeleteBtn").addEventListener("click", () => {
    if (!modalTarget) return;
    const { dk, index } = modalTarget;
    notesData[dk][index].text = "";
    notesData[dk][index].completed = false;
    notesData[dk][index].color = null;
    refreshCellByTarget(dk, index);
    closeModal();
    saveToStorage();
  });

  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  // ---- Onboarding popup ----
  const onboardingOverlay = document.getElementById("onboardingOverlay");
  const onboardingBtn = document.getElementById("onboardingBtn");

  function dayHasAnyNote(dk) {
    const arr = notesData[dk];
    if (!arr) return false;
    return arr.some((item) => item.text && item.text.trim().length > 0);
  }

  function openOnboarding() {
    onboardingOverlay.classList.remove("closing");
    onboardingOverlay.classList.add("visible");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        onboardingOverlay.classList.add("open");
      });
    });
  }

  function closeOnboarding() {
    onboardingOverlay.classList.remove("open");
    onboardingOverlay.classList.add("closing");
    setTimeout(() => {
      onboardingOverlay.classList.remove("visible");
      onboardingOverlay.classList.remove("closing");
    }, 200);
  }

  function focusTodayFirstCell() {
    const todayKey = keyOf(new Date());
    const col = document.querySelector(`.day-col[data-dk="${todayKey}"]`);
    if (!col) return;
    const notesCol = col.querySelector(".notes-col");
    const cell = notesCol && notesCol.children[0];
    if (cell) startInlineEdit(cell, todayKey, 0);
  }

  function maybeShowOnboarding() {
    // Only nudge the person while they're looking at the current (this) week,
    // and only if today doesn't have a single note yet.
    if (weekOffset !== 0) return;
    const todayKey = keyOf(new Date());
    ensureDay(todayKey);
    if (!dayHasAnyNote(todayKey)) {
      openOnboarding();
    }
  }

  onboardingBtn.addEventListener("click", () => {
    closeOnboarding();
    focusTodayFirstCell();
  });

  function render() {
    const dates = getWorkweek(weekOffset);
    document.getElementById("monthTitle").textContent = monthLabel(dates);

    const dks = dates.map(keyOf);
    dks.forEach(ensureDay);

    const grid = document.getElementById("weekGrid");
    grid.innerHTML = "";

    dates.forEach((date, i) => {
      const dk = dks[i];

      const col = document.createElement("div");
      col.className = "day-col day-col-enter";
      col.style.animationDelay = `${i * 60}ms`;
      col.dataset.dk = dk;

      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `
        <span class="day-date">${date.getDate()} ${MONTHS_SHORT[date.getMonth()]}</span>
        <span class="day-name">${DAY_NAMES[i]}</span>
      `;
      col.appendChild(head);

      const notesCol = document.createElement("div");
      notesCol.className = "notes-col";
      notesData[dk].forEach((_, index) => {
        const delay = i * 60 + Math.min(index * 25, 300);
        notesCol.appendChild(buildCell(dk, index, delay));
      });
      col.appendChild(notesCol);

      grid.appendChild(col);
    });
  }

  function buildCell(dk, index, delayMs) {
    const wrapper = document.createElement("div");
    wrapper.className = "note-cell note-cell-enter";
    wrapper.style.animationDelay = `${delayMs || 0}ms`;
    wrapper.draggable = true;

    wrapper.appendChild(buildTextButton(wrapper, dk, index));

    const tick = document.createElement("button");
    tick.type = "button";
    tick.className = "tick-btn";
    tick.setAttribute("aria-label", "Tamamlandı olarak işaretle");
    tick.innerHTML = notesData[dk][index].completed ? TICK_HOVER_SVG : TICK_SVG;
    tick.addEventListener("click", (e) => {
      e.stopPropagation();
      notesData[dk][index].completed = !notesData[dk][index].completed;
      updateCellState(wrapper, dk, index);
      saveToStorage();
    });
    wrapper.appendChild(tick);

    // Drag and drop
    wrapper.addEventListener("dragstart", (e) => {
      const child = wrapper.querySelector(".note-text-btn, .note-text-input");
      if (child && child.tagName === "INPUT") { e.preventDefault(); return; }
      dragSource = { dk, index };
      wrapper.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", `${dk}::${index}`);

      // Custom shadow-free drag preview matching our own note-cell design
      const rect = wrapper.getBoundingClientRect();
      const preview = wrapper.cloneNode(true);
      preview.classList.remove("dragging");
      preview.style.position = "fixed";
      preview.style.top = "-1000px";
      preview.style.left = "-1000px";
      preview.style.margin = "0";
      preview.style.width = rect.width + "px";
      preview.style.height = rect.height + "px";
      preview.style.boxShadow = "none";
      preview.style.pointerEvents = "none";
      document.body.appendChild(preview);
      e.dataTransfer.setDragImage(preview, e.offsetX, e.offsetY);
      setTimeout(() => preview.remove(), 0);
    });
    wrapper.addEventListener("dragend", () => {
      wrapper.classList.remove("dragging");
      dragSource = null;
    });
    wrapper.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });
    wrapper.addEventListener("dragenter", (e) => {
      e.preventDefault();
      wrapper.classList.add("drag-target");
    });
    wrapper.addEventListener("dragleave", () => {
      wrapper.classList.remove("drag-target");
    });
    wrapper.addEventListener("drop", (e) => {
      e.preventDefault();
      wrapper.classList.remove("drag-target");
      if (!dragSource) return;
      const src = dragSource;
      dragSource = null;
      if (src.dk === dk && src.index === index) return;
      moveNote(src.dk, src.index, dk, index);
      render();
      saveToStorage();
    });

    updateCellState(wrapper, dk, index);
    return wrapper;
  }

  function moveNote(srcDk, srcIndex, dstDk, dstIndex) {
    const srcArr = ensureDay(srcDk);
    const dstArr = ensureDay(dstDk);
    const [item] = srcArr.splice(srcIndex, 1);
    let insertAt = dstIndex;
    if (srcArr === dstArr && srcIndex < dstIndex) insertAt -= 1;
    dstArr.splice(insertAt, 0, item);
    // keep the source day from running out of empty rows
    if (srcArr.length === 0) srcArr.push({ text: "", completed: false });
  }

  function maybeGrowAll(dk, index) {
    if (index === notesData[dk].length - 1) {
      growDay(dk);
      window.requestAnimationFrame(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      });
    }
  }

  function growDay(dk) {
    const grid = document.getElementById("weekGrid");
    const col = grid.querySelector(`.day-col[data-dk="${dk}"]`);
    if (!col) return;
    const arr = ensureDay(dk);
    const nextIndex = arr.length;
    arr.push({ text: "", completed: false });
    const notesCol = col.querySelector(".notes-col");
    notesCol.appendChild(buildCell(dk, nextIndex));
    saveToStorage();
  }

  document.getElementById("prevBtn").addEventListener("click", () => { weekOffset -= 1; render(); });
  document.getElementById("nextBtn").addEventListener("click", () => { weekOffset += 1; render(); });
  document.getElementById("todayBtn").addEventListener("click", () => { weekOffset = 0; render(); maybeShowOnboarding(); });

  loadFromStorage();
  render();
  maybeShowOnboarding();
</script>
